<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Felhasználói regisztráció</h1>

        <form action="/" method="post">
            <label for="fullname">Teljes Név:</label>
            <input type="text" id="fullname" name="fullname" required><br><br>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="password">Jelszó:</label>
            <input type="password" id="password" name="password" required><br><br>

            <label for="telephone">Telefonszám:</label>
            <input type="tel" id="telephone" name="telephone" required><br><br>

            <label for="gender">Nem:</label><br>
            <input type="radio" id="gender" name="gender" value="male">
            <label for="male">Férfi</label><br>
            <input type="radio" id="gender" name="gender" value="female">
            <label for="woman">Nő</label><br>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Egyéb</label> <br><br>

            <label for="color">Kedvenc szín:</label>
            <input type="color" id="color" name="color" required><br><br>

            <label for="profil-pic">Profilkép feltöltése:</label>
            <input type="file" id="profil-pic" name="profil-pic" required><br><br>

            <label for="birth date">Születési dátum:</label>
            <input type="date" id="birth date" name="birth date" required><br><br>

            <label for="actual-time">Aktuális idő:</label>
            <input type="time" id="actual-time" name="actual-time" required><br><br>

            <label for="interests">Érdeklődési szint: (between 0 and 10):</label>
            <input type="range" id="interests" name="interests" min="1" max="100"><br><br>

            <input type="submit" value="Regisztrálok">
          </form>
</body>
</html>
